owner: Prestaservices
repo: status

# Current production (docker-compose host). The new cluster's components are added
# once it serves traffic, including the detailed infrastructure checks.
sites:
  - name: Web app
    url: https://v2.ipocamp.io/en/sign-in
  - name: Web app health
    url: https://v2.ipocamp.io/__health
  - name: API
    url: https://api.v2.ipocamp.io/__health
  - name: API domain lookup
    url: https://api.v2.ipocamp.io/domain
    headers:
      - "Origin: https://v2.ipocamp.io"

status-website:
  cname: status.ipocamp.io
  name: IPOCamp Status
  introTitle: "IPOCamp service status"
  introMessage: "Live status of the IPOCamp platform. Checks run every 5 minutes from GitHub's infrastructure, independently of our servers."
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
